name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      HAS_CODESCENE_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install CLI tools
        run: npm install -g markdownlint-cli2

      - name: Install released Netsuke
        run: |
          cargo install cargo-binstall --version 1.21.1 --locked
          cargo binstall --no-confirm --version 0.1.0-beta1 netsuke-build

      - name: Install Makefile parser
        env:
          MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
          MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install code
        run: make build

      - name: Validate Makefile
        run: make validate-makefile

      - name: Check spelling
        run: make spelling

      - name: Check formatting
        run: make check-fmt

      - name: Run lint and Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Run tests with coverage
        run: |
          uv pip install slipcover pytest-forked
          uv run python -m slipcover \
            --source=./post_turn_quality_stop_hook \
            --omit="*/unittests/*,*/.venv/*" \
            --branch \
            --out coverage.xml \
            -m pytest --forked -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Install CodeScene Coverage CLI
        if: env.HAS_CODESCENE_ACCESS_TOKEN == 'true'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
          CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
        run: |
          curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh \
            -o install-cs-coverage-tool.sh
          if [ -n "${CODESCENE_CLI_SHA256:-}" ]; then
            echo "${CODESCENE_CLI_SHA256}  install-cs-coverage-tool.sh" | sha256sum -c -
          fi
          bash install-cs-coverage-tool.sh -- -y

      - name: Upload coverage to CodeScene
        if: env.HAS_CODESCENE_ACCESS_TOKEN == 'true'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
          CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found!"
            exit 1
          fi
          cs-coverage upload \
            --format "cobertura" \
            --metric "line-coverage" \
            coverage.xml
