[project]
name = "post-turn-quality-stop-hook"
version = "0.1.0"
description = "post-turn-quality-stop-hook package"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "ISC" }
dependencies = [
    "cyclopts>=4.22.1,<5",
    "github3.py>=4.0,<5",
    "jinja2>=3.1,<4",
]

[project.scripts]
post-turn-quality-stop-hook = "post_turn_quality_stop_hook.hook:main"

[dependency-groups]
dev = [
    "hypothesis",
    "mbake",
    "pytest",
    "ruff",
    "pyright",
    "pytest-timeout",
    "pytest-xdist",
    "pyyaml>=6.0.3",
    "ty",
]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py313"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "EM",
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "D",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "undocumented-public-method",
    "boolean-type-hint-positional-argument",
    "no-self-use",
    "assert",
    "typing-only-third-party-import",
]
"tests/steps/*.py" = ["assert", "too-many-arguments", "magic-value-comparison"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.mutmut]
source_paths = ["post_turn_quality_stop_hook/"]
pytest_add_cli_args_test_selection = ["tests/"]
# tests/test_templates.py reads the canonical template copy relative to
# the working directory, so mutmut's mutants/ sandbox needs it too.
also_copy = ["docs/templates/"]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30

[tool.uv]
package = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
