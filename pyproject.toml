[project]
name = "post-turn-quality-stop-hook"
version = "0.1.0"
description = "post-turn-quality-stop-hook package"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "ISC" }
dependencies = [
    "cyclopts>=4.22.5,<5",
    "github3.py>=4.0,<5",
    "jinja2>=3.1,<4",
]

[project.scripts]
post-turn-quality-stop-hook = "post_turn_quality_stop_hook.hook:main"

[dependency-groups]
dev = [
    "hypothesis>=6.165.6,<7",
    "mbake",
    "pytest",
    "ruff",
    "pyright",
    "pytest-timeout",
    "pytest-xdist",
    "pyyaml>=6.0.3",
    "ty",
]

[tool.ruff]
# Vendored byte for byte; its digest is audited, so Ruff must not touch it.
extend-exclude = ["scripts/uv_gate.py"]
line-length = 88
preview = true

[tool.ruff.per-file-target-version]
"scripts/*.py" = "py313"

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "EM",
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "D",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = [
    "undocumented-public-method",
    "boolean-type-hint-positional-argument",
    "no-self-use",
    "assert",
    "typing-only-third-party-import",
]
"tests/steps/*.py" = ["assert", "too-many-arguments", "magic-value-comparison"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.mutmut]
source_paths = ["post_turn_quality_stop_hook/"]
pytest_add_cli_args_test_selection = ["tests/"]
# tests/test_templates.py reads the canonical template copy relative to
# the working directory, so mutmut's mutants/ sandbox needs it too.
also_copy = ["docs/templates/", "scripts/uv_gate.py", "Makefile"]

[tool.ty.environment]
# Tests import sibling support modules such as ``quality_support`` by name,
# so the tests directory is a resolution root alongside the package.
extra-paths = ["./tests"]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30

[tool.uv]
package = true

[tool.df12_skylos]
roots = ["post_turn_quality_stop_hook"]
python = "3.14"

[tool.skylos]
exclude = ["tests"]

[tool.skylos.gate]
strict = true

# The unpushed gate reads its upstream state through the ``UpstreamHeadSource``
# Protocol declared in ``upstream_port``, so the production adapter is reached
# through a Protocol-typed variable rather than a direct call. Skylos 4.33.2
# does not model Protocol dispatch, so it reports the adapter and every
# helper reachable only through it as unused. The two rules list those
# definitions exactly; they do not cover future members of the module or the
# class.
[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = [
  "post_turn_quality_stop_hook.upstream.fetch_upstream_head",
  "post_turn_quality_stop_hook.upstream._qualify_upstream_ref",
  "post_turn_quality_stop_hook.upstream._delete_temp_ref",
  "post_turn_quality_stop_hook.upstream._fetch_failure",
  "post_turn_quality_stop_hook.upstream._launch_failure",
  "post_turn_quality_stop_hook.upstream._configured_upstream",
  "post_turn_quality_stop_hook.upstream._checkout_state",
]
path = "post_turn_quality_stop_hook/upstream.py"
reason = """
`pipeline.refresh_upstream_head` calls `source.refresh_comparison()` on an
`UpstreamHeadSource`-typed variable, which resolves at runtime to
`GitUpstreamHeadSource.refresh_comparison`. That method calls `_head_for`,
which calls `fetch_upstream_head`, which calls `_qualify_upstream_ref`,
`_delete_temp_ref`, `_fetch_failure`, and (on a transport launch error)
`_launch_failure`; it also calls `_configured_upstream` and
`_checkout_state`. The pinned Skylos scan does not follow Protocol
dispatch, and an entry-point rule exempts only the symbol it names, so it sees
no static caller for this live chain. The runtime seam is exercised by
`tests/test_pipeline.py::TestUnpushedUpstreamPort`,
`tests/test_pipeline.py::TestUpstreamPortBoundary`, and
`tests/test_upstream_adapter.py::TestGitUpstreamHeadSource`.
"""

[[tool.skylos.dead_code.entrypoints]]
type = "method"
full_name = [
  "post_turn_quality_stop_hook.upstream.GitUpstreamHeadSource.refresh_comparison",
  "post_turn_quality_stop_hook.upstream.GitUpstreamHeadSource._checkout_matching",
  "post_turn_quality_stop_hook.upstream.GitUpstreamHeadSource._remote_names",
  "post_turn_quality_stop_hook.upstream.GitUpstreamHeadSource._head_for",
]
path = "post_turn_quality_stop_hook/upstream.py"
reason = """
`hook._git_upstream_source` builds `GitUpstreamHeadSource` and injects it as
an `UpstreamHeadSource`, and `pipeline.refresh_upstream_head` calls
`refresh_comparison()` through that Protocol, which is declared in
`upstream_port`. The pinned Skylos scan does not model Protocol dispatch
across modules, so the adapter's public method and the private helpers it
calls have no static caller. The runtime seam is exercised by
`tests/test_pipeline.py::TestUnpushedUpstreamPort` and
`tests/test_pipeline.py::TestUpstreamPortBoundary`.
"""

[tool.skylos.whitelist]
names = []

[tool.skylos.whitelist.documented]
"compush_check" = "Retained for downstream compatibility; active branch-state gates are configuration-driven"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
